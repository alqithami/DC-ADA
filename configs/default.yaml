# DC-Ada Default Experiment Configuration
# This runs a comprehensive comparison across all methods and heterogeneity levels

# Environments to test
environments:
  - warehouse
  - search_rescue
  - mapping

# Methods to compare
methods:
  - shared_policy
  - dc_ada
  - random_perturbation
  - local_finetuning
  - obs_normalization

# Heterogeneity levels (0=homogeneous, 3=severe heterogeneity)
heterogeneity_levels:
  - 0
  - 1
  - 2
  - 3

# Number of random seeds for statistical significance
num_seeds: 5

# Total environment steps budget (same for all methods for fair comparison)
total_budget: 50000

# Optional: Pre-trained shared policies (one per environment).
# If these files exist, run_experiment.py will load them for ALL methods.
pretrained_policies:
  warehouse: checkpoints/warehouse_policy.pth
  search_rescue: checkpoints/search_rescue_policy.pth
  mapping: checkpoints/mapping_policy.pth

# Environment settings
num_robots: 4
max_steps: 500

# Environment-specific parameters
# These are forwarded to the corresponding environment constructors.
warehouse:
  num_packages: 8
  target_deliveries: 2

search_rescue:
  num_victims: 6
  target_rescues: 2

mapping:
  grid_resolution: 20
  target_coverage: 0.75

# DC-Ada specific settings
dc_ada:
  num_candidates: 5
  noise_scale: 0.05
  step_size: 1.0
  acceptance_margin: 0.0
  adaptation_interval: 5
  candidate_rollout_fraction: 0.25
  deterministic_rollouts: true
  latent_dim: 32
  transform_init_std: 0.0

# Random perturbation baseline settings
random_perturbation:
  noise_scale: 0.05
  perturbation_interval: 5
  latent_dim: 32
  transform_init_std: 0.0

# Local fine-tuning baseline settings
local_finetuning:
  learning_rate: 0.0005
  finetune_interval: 1
  finetune_steps: 1
  training_rollout_fraction: 0.25
  deterministic_eval: true
  gamma: 0.99
  entropy_coef: 0.01
  grad_clip: 1.0
  latent_dim: 32
  transform_init_std: 0.0

# Output settings
output_dir: results
